# Wasmer Edge Deployment Configuration
# https://docs.wasmer.io/edge

[package]
name = "spore301/radar"
version = "0.1.0"
description = "CandidateRadar Next.js App on Wasmer Edge"

[[app]]
name = "radar"

[app.cli]
port = 3000

[app.env]
NODE_ENV = "production"
PORT = "3000"
HOSTNAME = "0.0.0.0"
DATABASE_URL = "file:/data/radar.db"
AUTH_TRUST_HOST = "true"

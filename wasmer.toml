# Wasmer Edge Deployment Configuration
# https://docs.wasmer.io/edge

[package]
name = "spore301/radar"
version = "0.1.0"
private = true
description = "CandidateRadar Next.js App on Wasmer Edge"

[package.annotations.anybuild]
node_remove_native_binaries = false

[[app]]
name = "radar"

[app.cli]
port = 3000

[app.env]
NODE_ENV = "production"
PORT = "3000"
HOSTNAME = "0.0.0.0"
AUTH_TRUST_HOST = "true"
